# /etc/nginx/sites-available/raspredelenie
#
# Хостовый nginx на сервере 135.106.145.98.
# Проксирует поддомен виджета «Распределение сделок» на локальный контейнер
# (127.0.0.1:3001), поднятый через docker-compose.shared.yml.
# Файл dubli НЕ трогаем — он в своём отдельном конфиге.
#
# После copy:
#   ln -sf /etc/nginx/sites-available/raspredelenie /etc/nginx/sites-enabled/raspredelenie
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d raspredelenie.koagency.ru --non-interactive --agree-tos -m partnerskoda@gmail.com
# (certbot --nginx автоматически допишет сюда server{} на 443 и редирект с 80).

server {
    listen 80;
    server_name raspredelenie.koagency.ru;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
