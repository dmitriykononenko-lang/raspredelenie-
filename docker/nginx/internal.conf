##############################################################################
# KO: WORKS — Виджет «Распределение сделок»
# Внутренний nginx — HTTP-обёртка для PHP-FPM.
#
# Слушает ТОЛЬКО внутри контейнера (порт 80), наружу публикуется как
# 127.0.0.1:3001 (см. docker-compose.shared.yml). НЕ терминирует TLS и
# НЕ занимает публичные 80/443 — этим занимается ХОСТОВЫЙ nginx, который
# проксирует https://raspredelenie.koagency.ru → http://127.0.0.1:3001.
##############################################################################

server {
    listen 80;
    server_name _;

    root  /app/public;
    index index.php;

    client_max_body_size 4m;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log  warn;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass   app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   /app/public;
        fastcgi_intercept_errors on;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.     { deny all; }
}
